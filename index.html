    .btn-secondary {

    /* ============================================================
       LOADING SCREEN
    ============================================================ */
    #loader-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #05070a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      transition: opacity 0.7s ease, visibility 0.7s ease;
    }

    #loader-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Sparkling particles */
    .loader-particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: floatParticle linear infinite;
      opacity: 0;
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(110vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 0.8;
      }

      90% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Gi silhouette */
    .loader-gi {
      position: relative;
      width: 120px;
      height: 160px;
      animation: giBreathe 2s ease-in-out infinite;
    }

    @keyframes giBreathe {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    /* Belt scene container */
    .belt-scene {
      position: relative;
      width: 340px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The two belt tails */
    .belt-left,
    .belt-right {
      position: absolute;
      height: 22px;
      border-radius: 3px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 40%, #1a1a1a 100%);
      border-top: 2px solid #333;
      border-bottom: 2px solid #000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .belt-left {
      width: 140px;
      left: 0;
      top: 50%;
      transform-origin: right center;
      animation: beltLeftSlide 3.2s ease forwards;
    }

    .belt-right {
      width: 140px;
      right: 0;
      top: 50%;
      transform-origin: left center;
      animation: beltRightSlide 3.2s ease forwards;
    }

    @keyframes beltLeftSlide {
      0% {
        transform: translateY(-50%) translateX(-110px);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      45% {
        transform: translateY(-50%) translateX(0);
      }

      60% {
        transform: translateY(-50%) translateX(20px) rotate(-8deg);
      }

      75% {
        transform: translateY(-50%) translateX(15px) rotate(-5deg);
      }

      90% {
        transform: translateY(-50%) translateX(18px) rotate(-6deg);
      }

      100% {
        transform: translateY(-50%) translateX(18px) rotate(-6deg);
      }
    }

    @keyframes beltRightSlide {
      0% {
        transform: translateY(-50%) translateX(110px);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      45% {
        transform: translateY(-50%) translateX(0);
      }

      60% {
        transform: translateY(-50%) translateX(-20px) rotate(8deg);
      }

      75% {
        transform: translateY(-50%) translateX(-15px) rotate(5deg);
      }

      90% {
        transform: translateY(-50%) translateX(-18px) rotate(6deg);
      }

      100% {
        transform: translateY(-50%) translateX(-18px) rotate(6deg);
      }
    }

    /* Knot center piece */
    .belt-knot {
      position: absolute;
      width: 48px;
      height: 40px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      animation: knotPop 3.2s ease forwards;
      z-index: 2;
    }

    @keyframes knotPop {
      0% {
        transform: translate(-50%, -50%) scale(0) rotate(-30deg);
        opacity: 0;
      }

      55% {
        transform: translate(-50%, -50%) scale(0) rotate(-30deg);
        opacity: 0;
      }

      70% {
        transform: translate(-50%, -50%) scale(1.25) rotate(5deg);
        opacity: 1;
      }

      80% {
        transform: translate(-50%, -50%) scale(0.95) rotate(-2deg);
      }

      88% {
        transform: translate(-50%, -50%) scale(1.08) rotate(1deg);
      }

      100% {
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    /* Belt loop loops (the bow parts of the knot) */
    .knot-body {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .knot-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #222, #0a0a0a);
      border-radius: 4px;
      border: 2px solid #333;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.9);
    }

    .knot-loop-left,
    .knot-loop-right {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #1c1c1c;
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
      top: 50%;
    }

    .knot-loop-left {
      left: -4px;
      transform: translateY(-50%) rotate(-20deg);
      border-color: #222;
      background: radial-gradient(circle, #1a1a1a, #0a0a0a);
    }

    .knot-loop-right {
      right: -4px;
      transform: translateY(-50%) rotate(20deg);
      border-color: #222;
      background: radial-gradient(circle, #1a1a1a, #0a0a0a);
    }

    /* Gold stripe on belt */
    .belt-left::after,
    .belt-right::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 8px;
      right: 8px;
      height: 3px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      opacity: 0.5;
      border-radius: 2px;
    }

    /* Loader text */
    .loader-text {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: loaderTextFade 0.8s ease 0.4s both;
    }

    @keyframes loaderTextFade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .loader-title {
      font-family: var(--font-heading);
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.1em;
      line-height: 1.2;
    }

    .loader-title span {
      color: var(--accent-green);
    }

    .loader-sub {
      font-family: var(--font-subheading);
      font-size: 0.75rem;
      letter-spacing: 0.22em;
      color: var(--accent-gold);
      text-transform: uppercase;
      margin-top: 0.35rem;
    }

    /* Animated dots */
    .loader-dots {
      display: flex;
      gap: 6px;
      margin-top: 0.5rem;
      justify-content: center;
    }

    .loader-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotPulse {

      0%,
      100% {
        transform: scale(0.5);
        opacity: 0.3;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Progress bar */
    .loader-progress {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      margin: 0.5rem auto 0;
    }

    .loader-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
      border-radius: 2px;
      animation: fillProgress 2.8s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }

    @keyframes fillProgress {
      0% {
        width: 0%;
      }

      60% {
        width: 70%;
      }

      80% {
        width: 88%;
      }

      100% {
        width: 100%;
      }
    }

    /* OSS flash */
    .loader-oss {
      position: absolute;
      font-family: var(--font-heading);
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      color: rgba(132, 204, 22, 0.06);
      letter-spacing: 0.3em;
      user-select: none;
      pointer-events: none;
      animation: ossGlow 4s ease-in-out infinite alternate;
    }

    @keyframes ossGlow {
      0% {
        opacity: 0.3;
        transform: scale(1);
      }

      100% {
        opacity: 0.6;
        transform: scale(1.04);
      }
    }
  </style>
</head>

  <!-- Loader dismiss script -->
  <script>
    (function () {
      // Spawn floating particles
      var container = document.getElementById('loaderParticles');
      for (var i = 0; i < 28; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        var dur = (4 + Math.random() * 5).toFixed(2) + 's';
        var delay = (Math.random() * 4).toFixed(2) + 's';
        p.style.animationDuration = dur;
        p.style.animationDelay = delay;
        // Some gold, most green
        if (Math.random() > 0.7) p.style.background = '#f59e0b';
        container.appendChild(p);
      }

      // Dismiss loader
      function hideLoader() {
        var el = document.getElementById('loader-screen');
        if (el) el.classList.add('hidden');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 750);
      }

      // Hide after 3.3s OR when page fully loads, whichever is later (min 3.3s)
      var minTime = new Promise(function (res) { setTimeout(res, 3300); });
      var loadTime = new Promise(function (res) {
        if (document.readyState === 'complete') { res(); }
        else { window.addEventListener('load', res); }
      });
      Promise.all([minTime, loadTime]).then(hideLoader);
    })();
  </script>
